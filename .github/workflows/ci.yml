name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # jsc ships with macOS; the check command skips the JavaScriptCore run elsewhere
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
