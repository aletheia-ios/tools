pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm exec vitest run

pre-push:
  jobs:
    - name: check
      run: pnpm check
